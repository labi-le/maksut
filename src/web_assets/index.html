<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Максут — настройки</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Максут</h1>
    <p class="hint" id="who"></p>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-memory" aria-selected="true">Память</button>
    <button type="button" role="tab" id="tab-config" aria-selected="false">Настройки</button>
    <button type="button" role="tab" id="tab-chats" aria-selected="false">Чаты</button>
  </nav>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <main id="panel-memory">
    <p class="hint" id="memory-empty" hidden>Записей нет.</p>
    <ul class="topics" id="topics"></ul>
  </main>
  <main id="panel-config" hidden>
    <p class="hint">Изменения пишутся в config.toml и применяются после рестарта бота.</p>
    <ul class="settings" id="settings"></ul>
  </main>
  <main id="panel-chats" hidden>
    <p class="hint" id="chats-defaults"></p>
    <p class="hint" id="chats-empty" hidden>Переопределений нет: все чаты используют глобальный [router].</p>
    <ul class="settings" id="chats"></ul>
    <h2>Новый чат</h2>
    <p class="hint">ID чата: у групп отрицательный, например -1001234567890.</p>
    <input id="chat-id" type="number" step="1" inputmode="numeric" placeholder="-1001234567890">
    <select id="chat-new-mode">
      <option value="off">роутер off</option>
      <option value="jev">роутер jev</option>
    </select>
    <input id="chat-new-confidence" type="number" step="0.05" min="0" max="1" value="0.6">
    <div class="actions"><button type="button" id="chat-new-save">Сохранить</button></div>
  </main>
</body>
</html>
