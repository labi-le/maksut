name: maksut

services:
  maksut:
    image: ghcr.io/labi-le/maksut:${MAKSUT_IMAGE_TAG:-main}
    build: .
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Read the token and owner from the file, not from the caller's shell:
    # an exported BOT_TOKEN would otherwise shadow .env and crash-loop the bot.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:///data/maksut.db
      DOWNLOAD_DIR: /tmp/maksut
      YTDLP_BIN: yt-dlp
      MAX_MEDIA_BYTES: ${MAX_MEDIA_BYTES:-47185920}
      COOKIES_FILE: /run/secrets/maksut/cookies.txt
      COOKIE_REFRESH_URL: http://cookie-refresh:8080
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm.labile.cc/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      CODE_DIR: /var/lib/maksut/code
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embeddings:8080/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    volumes:
      - data:/data
      # Bind the directory so atomic replacement of cookies.txt stays visible.
      - ${MAKSUT_COOKIES_DIR:-/home/eden/.local/share/maksut/cookies}:/run/secrets/maksut/:ro
      - ./self-improve:/var/lib/maksut/self-improve:rw
      # Deploys point these at a `git archive` export of the deployed commit so
      # `inspect_code` never reads the developer's working tree; manual runs
      # fall back to the checkout.
      - ${MAKSUT_CODE_DIR:-.}/src:/var/lib/maksut/code/src:ro
      - ${MAKSUT_CODE_DIR:-.}/tools:/var/lib/maksut/code/tools:ro
      - ${MAKSUT_CODE_DIR:-.}/docs:/var/lib/maksut/code/docs:ro
      - ${MAKSUT_CODE_DIR:-.}/Cargo.toml:/var/lib/maksut/code/Cargo.toml:ro
      - ${MAKSUT_CODE_DIR:-.}/README.md:/var/lib/maksut/code/README.md:ro
      - ${MAKSUT_CODE_DIR:-.}/AGENTS.md:/var/lib/maksut/code/AGENTS.md:ro

  # Vector index for chat history and code facts. SQLite stays canonical, so
  # the bot runs (and retrieval degrades to lexical) when this service is down.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Keep every write on the shared volume, not in the image layer.
      QDRANT__STORAGE__STORAGE_PATH: /data/qdrant
      QDRANT__STORAGE__SNAPSHOTS_PATH: /data/qdrant/snapshots
    volumes:
      - data:/data
    mem_limit: 1g
    healthcheck:
      # The image ships bash but no curl; a TCP connect proves the REST port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Local CPU embedding server (384-d multilingual-e5-small) so Qdrant indexing
  # and semantic search never depend on external embedding API keys or quotas.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.3
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --model-id
      - intfloat/multilingual-e5-small
      - --dtype
      - float32
      - --port
      - "8080"
      - --auto-truncate
      - --max-client-batch-size
      - "128"
      - --tokenization-workers
      - "2"
    environment:
      HUGGINGFACE_HUB_CACHE: /data/huggingface
      HF_HOME: /data/huggingface
      RAYON_NUM_THREADS: "4"
    volumes:
      - data:/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  cookie-refresh:
    build:
      context: .
      dockerfile: cookie_refresh/Dockerfile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:size=16m
    environment:
      COOKIE_SSH_TARGETS: ${COOKIE_SSH_TARGETS:-labile@pc,labile@notebook}
      COOKIE_SSH_KEY: /run/secrets/cookie_refresh/id_ed25519
      COOKIE_SSH_KNOWN_HOSTS: /run/secrets/cookie_refresh/known_hosts
      COOKIE_JAR: /run/secrets/maksut/cookies.txt
    extra_hosts:
      - "pc:${COOKIE_HOST_PC:-192.168.1.3}"
      - "notebook:${COOKIE_HOST_NOTEBOOK:-192.168.1.155}"
    volumes:
      - ${MAKSUT_COOKIES_DIR:-/home/eden/.local/share/maksut/cookies}:/run/secrets/maksut:rw
      - ./.secrets/cookie-refresh:/run/secrets/cookie_refresh:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
    name: maksut_data
    external: true
