name: dependabot automerge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restrict the change to manifests
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          paths=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$paths"
          unexpected=$(printf '%s\n' "$paths" | grep -vxE 'Cargo\.toml|Cargo\.lock' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected paths in a dependabot pull request:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: cargo check
        run: cargo check --all-targets

  merge:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge the dependabot pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
