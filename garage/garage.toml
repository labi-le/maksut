# Garage configuration for the chat-media blob store. Secrets are supplied by
# the environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN) and never live here.
metadata_dir = "/data/garage/meta"
data_dir = "/data/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
